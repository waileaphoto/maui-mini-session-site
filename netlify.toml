[build]
  publish = "."

[[redirects]]
  from = "https://www.mauiminisession.com/*"
  to = "https://mauiminisession.com/:splat"
  status = 301
  force = true

  # Old blog post URLs from a previous version of this site (Squarespace-style /f/ paths)
  # are still indexed by Google and were 404ing. Send them to the homepage instead of a
  # dead end for anyone clicking through from a stale search result.
  [[redirects]]
    from = "/f/*"
      to = "/"
        status = 301

          # Old CMS blog-filter query strings (e.g. /?blog=y&blogcategory=Maui+Food+Reviews) already
            # resolve to the homepage, but Google sees each one as a separate duplicate page. Redirect
              # them to the clean homepage URL. Scoped narrowly to the `blog` param so real ad-tracking
                # query strings (utm_source, fbclid, etc.) on the homepage are never touched.
                  [[redirects]]
                      from = "/"
                          to = "/"
                              status = 301
                                  force = true
                                      [redirects.query]
                                            blog = ":anything"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
