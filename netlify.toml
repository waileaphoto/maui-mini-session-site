[build]
  publish = "."

[[redirects]]
  from = "https://www.mauiminisession.com/*"
  to = "https://mauiminisession.com/:splat"
  status = 301
  force = true

  # Old blog post URLs from a previous version of this site (Squarespace-style /f/ paths)
  # are still indexed by Google and were 404ing. Send them to the homepage instead of a
  # dead end for anyone clicking through from a stale search result. .
  [[redirects]]
    from = "/f/*"
      to = "/"
        status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
