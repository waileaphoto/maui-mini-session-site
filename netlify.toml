[build]
  publish = "."

[[redirects]]
  from = "https://www.mauiminisession.com/*"
  to = "https://mauiminisession.com/:splat"
  status = 301
  force = true

# Old Squarespace-style /f/ paths still appear in historic indexes.
[[redirects]]
  from = "/f/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
