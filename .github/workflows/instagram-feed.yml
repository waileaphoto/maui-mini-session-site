name: Refresh Instagram feed

on:
  schedule:
    - cron: "17 16 * * *"   # daily, 6:17am HST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Update grid
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/update_instagram.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Instagram feed bot"
            git config user.email "actions@github.com"
            git add index.html assets/instagram
            git commit -m "Refresh Instagram feed"
            git push
          else
            echo "No changes."
          fi
